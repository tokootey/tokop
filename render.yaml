# Publicación en Render (https://render.com): New → Blueprint → elegir este repositorio.
# Los datos se guardan en un disco persistente, así no se pierden al reiniciar.
services:
  - type: web
    name: rentacar-ushuaia
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DB_FILE
        value: /var/data/rentacar.db
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_EMAIL
        value: admin@rentacar.local
      - key: ADMIN_PASSWORD
        generateValue: true
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
