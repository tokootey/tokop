<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Floty · Gestión para rent a car</title>
    <link rel="icon" href="/floty.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="login" class="login hidden">
      <form id="login-form" class="card login-card">
        <div class="login-brand"><img src="/floty.svg" alt="" width="44" height="44" /><div><h1>Floty</h1><p class="muted">Gestión simple para tu rent a car</p></div></div>
        <p class="muted">Ingresá con tu usuario</p>
        <label>Email <input name="email" type="email" required autocomplete="username" /></label>
        <label>Contraseña <input name="password" type="password" required autocomplete="current-password" /></label>
        <button class="btn primary" type="submit">Ingresar</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>

    <div id="shell" class="shell hidden">
      <aside class="sidebar">
        <a class="brand" href="#/panel"><img src="/floty.svg" alt="" width="34" height="34" /><span><b id="brand">Floty</b><small>con Floty</small></span></a>
        <!-- Cuatro secciones: en el celular el menú queda abajo, como una app. -->
        <nav id="nav" aria-label="Menú">
          <a href="#/panel" data-route="panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Hoy</span></a>
          <a href="#/planning" data-route="planning"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendario</span></a>
          <a href="#/flota" data-route="flota"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16l1.5-5h11L19 16M5 16h14v3H5zM7.5 19v1.5M16.5 19v1.5"/></svg><span>Autos</span></a>
          <a href="#/mas" data-route="mas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg><span>Más</span></a>
        </nav>
        <div class="user-box">
          <!-- Botón de cuenta: solo en el Panel de Floty (body.owner); en las agencias el menú queda a la vista. -->
          <button id="acct-btn" class="acct-btn" type="button" aria-expanded="false" aria-controls="acct-menu" aria-label="Tu cuenta"></button>
          <div id="acct-menu" class="acct-menu">
            <span id="user-name" class="user-name"></span>
            <span class="user-actions"><button id="change-pw" class="btn link" type="button">Cambiar contraseña</button><button id="logout" class="btn link" type="button">Salir</button><a id="floty-panel" class="btn link hidden" href="#/empresas">Panel de Floty</a></span>
          </div>
        </div>
      </aside>
      <main class="view"><nav id="subnav" class="subnav hidden"></nav><div id="view"></div></main>
      <a id="fab" class="fab" href="#/reservas/nueva"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva reserva</a>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-box card">
        <div class="modal-head">
          <h2 id="modal-title"></h2>
          <button class="btn link" data-close>✕</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>
    <div id="toast" class="toast hidden"></div>

    <script src="/vendor/jspdf.umd.min.js"></script>
    <script src="/vendor/jspdf.plugin.autotable.min.js"></script>
    <script src="/i18n.js"></script>
    <script src="/contract-pdf.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
